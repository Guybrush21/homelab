# NetworkPolicy
# `flux bootstrap` installs NetworkPolicies in flux-system that only accept
# traffic from other namespaces on 8080 (metrics). The Web UI is on 9080, so
# Traefik got "502 Bad Gateway" until this lets it in.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-flux-web
  namespace: flux-system
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: flux-operator
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              # set automatically by Kubernetes on every namespace
              kubernetes.io/metadata.name: traefik
      ports:
        - port: 9080
          protocol: TCP
