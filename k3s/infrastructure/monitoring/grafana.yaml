# Grafana - dashboards, log explorer and alerting. Datasources, dashboards and
# alert rules are all provisioned from git (config/, dashboards/); only UI
# state (users, preferences, starred dashboards) lives in its SQLite DB.
# Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: monitoring
  labels:
    app: grafana
spec:
  replicas: 1
  strategy:
    type: Recreate # SQLite on a hostPath: one writer at a time
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 472
        runAsGroup: 472
        runAsNonRoot: true
      containers:
        - name: grafana
          image: grafana/grafana:13.2.3
          env:
            - name: GF_SERVER_ROOT_URL
              value: https://grafana.elaine.pw
            - name: GF_SECURITY_ADMIN_USER
              value: admin
            - name: GF_USERS_ALLOW_SIGN_UP
              value: "false"
            - name: GF_ANALYTICS_REPORTING_ENABLED
              value: "false"
            - name: GF_ANALYTICS_CHECK_FOR_UPDATES
              value: "false"
            - name: GF_NEWS_NEWS_FEED_ENABLED
              value: "false"
            # Open on the alerts overview instead of the generic welcome page.
            - name: GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH
              value: /etc/grafana/dashboards/alerts.json
          envFrom:
            # GF_SECURITY_ADMIN_PASSWORD - only read when the DB is first
            # created; after that, change it in the UI.
            - secretRef:
                name: grafana-env
          ports:
            - name: http
              containerPort: 3000
          volumeMounts:
            - name: data
              mountPath: /var/lib/grafana
            - name: provisioning
              mountPath: /etc/grafana/provisioning
            - name: dashboards
              mountPath: /etc/grafana/dashboards
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 15
      volumes:
        - name: data
          hostPath:
            path: /var/lib/homelab-data/monitoring/grafana
            type: Directory
        # Grafana wants each kind of provisioning in its own subdirectory;
        # `items` places each key of the one ConfigMap where it belongs.
        - name: provisioning
          configMap:
            name: grafana-provisioning
            items:
              - key: grafana-datasources.yaml
                path: datasources/datasources.yaml
              - key: grafana-dashboards.yaml
                path: dashboards/dashboards.yaml
              - key: grafana-alerting.yaml
                path: alerting/alerting.yaml
        # Two ConfigMaps (see kustomization.yaml) merged into one directory.
        - name: dashboards
          projected:
            sources:
              - configMap:
                  name: grafana-dashboards-node
              - configMap:
                  name: grafana-dashboards-k8s
---
# Service
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: monitoring
spec:
  selector:
    app: grafana
  ports:
    - name: http
      port: 3000
      targetPort: http
---
# IngressRoute
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: grafana
  namespace: monitoring
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`grafana.elaine.pw`)
      kind: Rule
      services:
        - name: grafana
          port: 3000
  tls:
    certResolver: cloudflare
