# Prometheus scrape config, written by hand instead of generated by the
# Prometheus Operator. Every target below is found through the Kubernetes API
# (kubernetes_sd_configs): Prometheus asks "which pods/nodes exist?" and the
# relabel rules decide what to keep and how to label it.
#
# Every job adds cluster="elaine": the k8s dashboards filter on a `cluster`
# label, which a single-node setup would otherwise never have.

global:
  scrape_interval: 30s
  evaluation_interval: 30s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
    relabel_configs:
      - target_label: cluster
        replacement: elaine

  # Any pod opting in with the annotation prometheus.io/scrape: "true" and
  # exposing a container port named "metrics". That covers node-exporter,
  # kube-state-metrics and smartctl-exporter - and any app added later.
  - job_name: kubernetes-pods
    # kube-state-metrics reports on *other* pods, so its series carry their
    # own namespace/pod labels. honor_labels keeps those instead of
    # overwriting them with kube-state-metrics' own namespace/pod.
    honor_labels: true
    kubernetes_sd_configs:
      - role: pod
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
        regex: "true"
        action: keep
      # role: pod yields one target per container port; keep only the
      # metrics one so multi-port pods aren't scraped twice.
      - source_labels: [__meta_kubernetes_pod_container_port_name]
        regex: metrics
        action: keep
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
        regex: (.+)
        target_label: __metrics_path__
      # job = the pod's `app` label: node-exporter, kube-state-metrics, ...
      - source_labels: [__meta_kubernetes_pod_label_app]
        target_label: job
      - source_labels: [__meta_kubernetes_namespace]
        target_label: namespace
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod
      - source_labels: [__meta_kubernetes_pod_node_name]
        target_label: node
      - target_label: cluster
        replacement: elaine

  # The kubelet's own metrics, and cAdvisor - which is built into the kubelet
  # and is where per-container CPU/memory comes from. role: node gives one
  # target per node at <InternalIP>:10250.
  - job_name: kubelet
    scheme: https
    authorization:
      credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
    tls_config:
      # k3s signs the kubelet serving cert with its own CA, not the one
      # mounted into pods. Traffic never leaves the node.
      insecure_skip_verify: true
    kubernetes_sd_configs:
      - role: node
    relabel_configs:
      - source_labels: [__meta_kubernetes_node_name]
        target_label: node
      - target_label: cluster
        replacement: elaine

  - job_name: cadvisor
    scheme: https
    metrics_path: /metrics/cadvisor
    authorization:
      credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
    tls_config:
      insecure_skip_verify: true
    kubernetes_sd_configs:
      - role: node
    relabel_configs:
      - source_labels: [__meta_kubernetes_node_name]
        target_label: node
      - target_label: cluster
        replacement: elaine
