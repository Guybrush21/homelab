apiVersion: apps/v1
kind: Deployment
metadata:
  name: deluge
  namespace: homelab
  labels:
    app: deluge
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: deluge
  template:
    metadata:
      labels:
        app: deluge
    spec:
      # hostNetwork so the 50101-50300 torrent range (already open in the
      # NixOS firewall) just works, instead of needing 200 hostPort entries
      # or raising k3s's NodePort ceiling. The web UI (8112) rides along on
      # the same host network - the Service below just targets the node.
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: deluge
          image: lscr.io/linuxserver/deluge:latest
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: Europe/Rome
            - name: DELUGE_LOGLEVEL
              value: info
          ports:
            - name: web
              containerPort: 8112
          volumeMounts:
            - name: config
              mountPath: /config
            # Whole media tree, matching the old compose setup: Deluge writes
            # downloads anywhere under here, Jellyfin reads the film/tvseries/
            # music/book subfolders it needs.
            - name: media
              mountPath: /downloads
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: "2"
              memory: 1Gi
          readinessProbe:
            tcpSocket:
              port: 8112
            initialDelaySeconds: 15
            periodSeconds: 15
      volumes:
        - name: config
          hostPath:
            path: /var/lib/homelab-data/deluge/config
            type: Directory
        - name: media
          hostPath:
            path: /mnt/murray/media
            type: Directory
