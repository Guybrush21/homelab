# DNS service: gets its own MetalLB address so the LAN can point at it
# directly. This is what the Fritz!Box hands out as the DNS server.
apiVersion: v1
kind: Service
metadata:
  name: adguard-dns
  namespace: homelab
  labels:
    app: adguard
  annotations:
    metallb.io/loadBalancerIPs: 192.168.178.51
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  selector:
    app: adguard
  ports:
    - name: dns-tcp
      protocol: TCP
      port: 53
      targetPort: 53
    - name: dns-udp
      protocol: UDP
      port: 53
      targetPort: 53
---
# Web UI, reached through Traefik at adguard.elaine.pw
apiVersion: v1
kind: Service
metadata:
  name: adguard
  namespace: homelab
  labels:
    app: adguard
spec:
  type: ClusterIP
  selector:
    app: adguard
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 80
