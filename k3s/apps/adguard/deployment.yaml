apiVersion: apps/v1
kind: Deployment
metadata:
  name: adguard
  namespace: homelab
  labels:
    app: adguard
spec:
  replicas: 1
  strategy:
    # Only one pod may hold the :53 LoadBalancer address at a time.
    type: Recreate
  selector:
    matchLabels:
      app: adguard
  template:
    metadata:
      labels:
        app: adguard
    spec:
      containers:
        - name: adguard
          image: adguard/adguardhome:latest
          ports:
            - name: dns-tcp
              containerPort: 53
              protocol: TCP
            - name: dns-udp
              containerPort: 53
              protocol: UDP
            - name: http
              containerPort: 80
          volumeMounts:
            - name: conf
              mountPath: /opt/adguardhome/conf
            - name: work
              mountPath: /opt/adguardhome/work
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 20
      volumes:
        # Carried over from the docker-compose setup: existing users, upstreams,
        # filter lists and the *.elaine.pw split-horizon rewrites all live here.
        - name: conf
          hostPath:
            path: /var/lib/homelab-data/adguardhome/conf
            type: Directory
        - name: work
          hostPath:
            path: /var/lib/homelab-data/adguardhome/work
            type: Directory
