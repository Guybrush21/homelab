apiVersion: apps/v1
kind: Deployment
metadata:
  name: shelfmark
  namespace: homelab
  labels:
    app: shelfmark
spec:
  replicas: 1
  selector:
    matchLabels:
      app: shelfmark
  template:
    metadata:
      labels:
        app: shelfmark
    spec:
      containers:
        - name: shelfmark
          image: ghcr.io/calibrain/shelfmark:v1.4.0
          ports:
            - name: http
              containerPort: 8084
          volumeMounts:
            - name: config
              mountPath: /config
            - name: ingest
              mountPath: /books
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 2Gi
          livenessProbe:
            httpGet:
              path: /
              port: 8084
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: Europe/Rome
      volumes:
        - name: config
          hostPath:
            path: /var/lib/homelab-data/shelfmark/
            type: DirectoryOrCreate
        - name: ingest
          hostPath:
            path: /mnt/murray/media/book/calibre/calibre-ingest
            type: DirectoryOrCreate

---
# Service
apiVersion: v1
kind: Service
metadata:
  name: shelfmark
  namespace: homelab
spec:
  type: ClusterIP
  selector:
    app: shelfmark
  ports:
    - name: http
      port: 8084
      targetPort: 8084
---
# IngressRoute
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: shelfmark
  namespace: homelab
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`shelfmark.elaine.pw`)
      kind: Rule
      services:
        - name: shelfmark
          port: 8084
  tls:
    certResolver: cloudflare
