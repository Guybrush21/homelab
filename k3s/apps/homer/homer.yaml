# Homer - dashboard
# Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: homer
  namespace: homelab
  labels:
    app: homer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: homer
  template:
    metadata:
      labels:
        app: homer
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: homer
          image: b4bz/homer:latest
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: assets
              mountPath: /www/assets
            - name: config
              mountPath: /www/assets/config.yml
              subPath: config.yml
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 200m
              memory: 128Mi
      volumes:
        - name: assets
          hostPath:
            path: /var/lib/homelab-data/homer/assets
            type: Directory
        - name: config
          configMap:
            name: homer-config
---
# Service
apiVersion: v1
kind: Service
metadata:
  name: homer
  namespace: homelab
  labels:
    app: homer
spec:
  type: ClusterIP
  selector:
    app: homer
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
---
# IngressRoute
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: homer
  namespace: homelab
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`homer.elaine.pw`)
      kind: Rule
      services:
        - name: homer
          port: 8080
  tls:
    certResolver: cloudflare
