apiVersion: apps/v1
kind: Deployment
metadata:
  name: ddclient
  namespace: homelab
  labels:
    app: ddclient
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ddclient
  template:
    metadata:
      labels:
        app: ddclient
    spec:
      # The linuxserver image needs a writable /config (it writes a cache file
      # and fixes permissions at boot), so the secret cannot be mounted there
      # directly - secret volumes are read-only. Seed an emptyDir from it instead.
      initContainers:
        - name: seed-config
          image: busybox:1.36
          command:
            - sh
            - -c
            - install -m 600 -o 1000 -g 1000 /secret/ddclient.conf /config/ddclient.conf
          volumeMounts:
            - name: config
              mountPath: /config
            - name: secret
              mountPath: /secret
              readOnly: true
      containers:
        - name: ddclient
          image: lscr.io/linuxserver/ddclient:latest
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: Europe/Rome
          volumeMounts:
            - name: config
              mountPath: /config
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
      volumes:
        - name: config
          emptyDir: {}
        - name: secret
          secret:
            secretName: ddclient-config
            defaultMode: 0600
