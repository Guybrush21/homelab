---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: homelab-apps
  namespace: flux-system
spec:
  interval: 10m0s
  path: ./k3s/apps
  prune: true
  # Apps must never come up before Traefik/MetalLB exist, and a broken app
  # must not be able to take infrastructure down with it.
  dependsOn:
    - name: homelab-infrastructure
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
